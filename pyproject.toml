[project]
name = "the-machine"
version = "0.10.16"
description = "The Machine (TM): a local AI agent that can control your machine"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "albert", email = "beyondalbert@gmail.com" }]
keywords = ["ai", "agent", "llm", "cli", "automation", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "typing-extensions>=4.12; python_version < '3.9'",
]

[project.urls]
Homepage = "https://github.com/beyondalbert/tm"
Repository = "https://github.com/beyondalbert/tm"
Issues = "https://github.com/beyondalbert/tm/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
# google-genai requires Python 3.9+; textual requires 3.8.1+.
google = ["google-genai>=0.3; python_version >= '3.9'"]
tui = ["textual>=0.80; python_full_version >= '3.8.1'"]
all = [
    "anthropic>=0.39",
    "google-genai>=0.3; python_version >= '3.9'",
    "textual>=0.80; python_full_version >= '3.8.1'",
]

[project.scripts]
tm = "tm.cli.main:run_cli"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
    # tm.compat imports these on older interpreters; keep them installed so the
    # mypy run and the 3.8 test job see the same modules.
    "tomli>=2.0",
    "typing-extensions>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm"]

[tool.hatch.build.targets.sdist]
# Local virtualenvs must never leak into the sdist; one once added ~36 MB
# of interpreter-version-specific dependencies.
exclude = ["/tests", "/.venv*", "/dist"]

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# These annotations are evaluated at runtime (typer resolves command parameters,
# pydantic resolves model fields), so they must stay 3.8-compatible: Optional,
# Union, List. Future annotations do not help there.
"src/tm/cli/main.py" = ["UP006", "UP007", "UP045"]
"src/tm/cli/models_cmd.py" = ["UP006", "UP007", "UP045"]
"src/tm/im/cli.py" = ["UP006", "UP007", "UP045"]
"src/tm/ai/types.py" = ["UP006", "UP007", "UP045"]
"src/tm/core/events.py" = ["UP006", "UP007", "UP045"]
"src/tm/core/operation.py" = ["UP006", "UP007", "UP045"]
"src/tm/permissions/policy.py" = ["UP006", "UP007", "UP045"]
"src/tm/tools/base.py" = ["UP006", "UP007", "UP045"]
"src/tm/tools/edit.py" = ["UP006", "UP007", "UP045"]
"src/tm/tools/elevate.py" = ["UP006", "UP007", "UP045"]
"src/tm/tools/grep.py" = ["UP006", "UP007", "UP045"]
"src/tm/tools/process.py" = ["UP006", "UP007", "UP045"]
"src/tm/tools/python.py" = ["UP006", "UP007", "UP045"]
"src/tm/tools/read.py" = ["UP006", "UP007", "UP045"]
"src/tm/tools/shell.py" = ["UP006", "UP007", "UP045"]

[tool.mypy]
# mypy 2.x dropped 3.8/3.9 as analysis targets; 3.10 is the lowest it accepts.
# Runtime support for 3.8 is covered by the CI test matrix.
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# google-genai needs Python 3.9+, so the extra cannot be installed on 3.8.
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: end-to-end eval scenarios (offline unless a real provider is configured)",
    "live: evals that call a real provider and need credentials",
]
