[project]
name = "the-machine"
version = "0.1.0"
description = "The Machine (TM): a local AI agent that can control your machine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
google = ["google-genai>=0.3"]
tui = ["textual>=0.80"]
all = [
    "anthropic>=0.39",
    "google-genai>=0.3",
    "textual>=0.80",
]

[project.scripts]
tm = "tm.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
