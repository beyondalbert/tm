# gitleaks configuration: keep the default rules and allow known-safe values.

[extend]
useDefault = true

[allowlist]
description = "Synthetic test values and vendored reference code"
paths = [
  '''^pi/''',
]
regexes = [
  # Synthetic provider key used in tests/test_cli.py
  '''sk-0{32}''',
  '''sk-x{4,}''',
  # Synthetic tm_im example key from the integration docs (16 hex, not usable)
  '''sk_live_9f2c1d7a4b8e3f60''',
  '''sk_live_(file|k|env)''',
]
